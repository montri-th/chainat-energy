name: Preview quality checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run qa -- --write test-results/qa-ci.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounded-preview-qa
          path: test-results/
          if-no-files-found: ignore
