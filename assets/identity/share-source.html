<!doctype html>
<html lang="th" data-theme="light">
<head>

  <title>ภาพแชร์พลังงานชัยนาท · CityMETER: Yolk</title>
  <link rel="stylesheet" href="../lds/build-kit/lds-0.9.7.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body { background: var(--ldm-foundation-surface-canvas-light); color: var(--ldm-foundation-text-primary-light); font: 400 24px/1.6 "Bai Jamjuree", sans-serif; }

    section { background: var(--ldm-atmosphere-gradient-measure-deep); color: #FFFFFF; border-radius: 32px; padding: 32px 40px; display: grid; align-content: start; gap: 12px; }

    h1 { margin: 0; font: 700 64px/1.45 "IBM Plex Sans Thai Looped", sans-serif; }

    .flow { margin: 4px 0 0; font-size: 22px; line-height: 1.6; color: #F1F4EF; }
    .note { margin: 12px 0 0; padding-top: 12px; border-top: 1px solid #F1F4EF; font-size: 18px; color: #F1F4EF; }

</head>
<body><main>
  <header><img src="./landometer-logo-horizontal-v12-889.png" alt="Landometer" width="889" height="244"><p class="product">CityMETER: Yolk</p></header>
  <section aria-labelledby="title">

    <p class="flow">ความต้องการ → กิจการพลังงาน → โอกาส → คิวลงพื้นที่</p>
    <p class="note">ต้นแบบสาธิต · ความต้องการรายพื้นที่เป็นแบบจำลอง · ข้อมูลรอบ 18 ต.ค. 2569</p>
  </section>
